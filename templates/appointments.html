{% extends 'base.html' %}{% block content %}<h2>Appointments</h2><div class="card p-3 mb-4"><form method="post"><div class="row g-2"><div class="col-md-3"><select name="patient_id" class="form-select" required><option value="">Patient</option>{% for p in patients %}<option value="{{p.id}}">{{p.name}} ({{p.patient_code}})</option>{% endfor %}</select></div><div class="col-md-3"><select name="doctor_id" class="form-select" required><option value="">Doctor</option>{% for d in doctors %}<option value="{{d.id}}">{{d.name}} — {{d.specialization}}</option>{% endfor %}</select></div><div class="col-md-2"><input type="date" name="appointment_date" class="form-control" required></div><div class="col-md-2"><input type="time" name="appointment_time" class="form-control" required></div><div class="col-md-2"><input name="reason" class="form-control" placeholder="Reason"></div></div><button class="btn btn-primary mt-3">Schedule Appointment</button></form></div><div class="card"><div class="table-responsive"><table class="table mb-0"><thead><tr><th>Date</th><th>Time</th><th>Patient</th><th>Doctor</th><th>Status</th><th>Action</th></tr></thead><tbody>{% for a in appointments %}<tr><td>{{a.appointment_date}}</td><td>{{a.appointment_time}}</td><td>{{a.patient_name}}</td><td>{{a.doctor_name}}</td><td>{{a.status}}</td><td><a class="btn btn-sm btn-outline-success" href="{{url_for('appointment_status',id=a.id,status='Completed')}}">Complete</a> <a class="btn btn-sm btn-outline-danger" href="{{url_for('appointment_status',id=a.id,status='Cancelled')}}">Cancel</a></td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
