<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - MediCare</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}"></head><body class="login-bg"><div class="card login-card shadow"><div class="card-body p-4"><div class="text-center mb-4"><div class="logo">🏥</div><h2>MediCare</h2><p class="text-muted">Multispeciality Hospital Management</p></div>{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="alert alert-{{c}}">{{m}}</div>{% endfor %}{% endwith %}<form method="post"><label>Username</label><input class="form-control mb-3" name="username" required><label>Password</label><input class="form-control mb-3" type="password" name="password" required><button class="btn btn-primary w-100">Login</button></form><p class="small text-muted text-center mt-3">Default admin: admin / admin123</p></div></div></body></html>
