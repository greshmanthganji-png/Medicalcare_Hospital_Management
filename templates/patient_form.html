{% extends 'base.html' %}{% block content %}<h2>Register Patient</h2><form method="post" class="card p-4"><div class="row g-3"><div class="col-md-6"><label>Full Name *</label><input name="name" class="form-control" required></div><div class="col-md-3"><label>Gender *</label><select name="gender" class="form-select" required><option>Male</option><option>Female</option><option>Other</option></select></div><div class="col-md-3"><label>Date of Birth</label><input name="dob" type="date" class="form-control"></div><div class="col-md-4"><label>Phone</label><input name="phone" class="form-control"></div><div class="col-md-4"><label>Email</label><input name="email" type="email" class="form-control"></div><div class="col-md-4"><label>Blood Group</label><input name="blood_group" class="form-control" placeholder="e.g. O+"></div><div class="col-12"><label>Address</label><input name="address" class="form-control"></div><div class="col-md-6"><label>Emergency Contact</label><input name="emergency_contact" class="form-control"></div><div class="col-md-6"><label>Emergency Phone</label><input name="emergency_phone" class="form-control"></div></div><button class="btn btn-primary mt-4">Register Patient</button></form>{% endblock %}
