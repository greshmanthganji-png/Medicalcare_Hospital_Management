{% extends 'base.html' %}{% block content %}<h2>Billing & Payments</h2><div class="card p-3 mb-4"><form method="post"><div class="row g-2"><div class="col-md-3"><select name="patient_id" class="form-select" required><option value="">Patient</option>{% for p in patients %}<option value="{{p.id}}">{{p.name}} ({{p.patient_code}})</option>{% endfor %}</select></div><div class="col-md-2"><input name="consultation_amount" type="number" step="0.01" class="form-control" placeholder="Consultation"></div><div class="col-md-2"><input name="room_amount" type="number" step="0.01" class="form-control" placeholder="Room"></div><div class="col-md-2"><input name="medicine_amount" type="number" step="0.01" class="form-control" placeholder="Medicine"></div><div class="col-md-2"><input name="other_amount" type="number" step="0.01" class="form-control" placeholder="Other"></div><div class="col-md-2"><select name="payment_status" class="form-select"><option>Pending</option><option>Paid</option><option>Partially Paid</option></select></div><div class="col-md-2 mt-2"><select name="payment_method" class="form-select"><option>Cash</option><option>Card</option><option>UPI</option><option>Insurance</option></select></div></div><button class="btn btn-primary mt-3">Create Bill</button></form></div><div class="card"><div class="table-responsive"><table class="table"><thead><tr><th>ID</th><th>Patient</th><th>Date</th><th>Total</th><th>Status</th><th>Method</th></tr></thead><tbody>{% for b in bills %}<tr><td>#{{b.id}}</td><td>{{b.patient_name}}</td><td>{{b.bill_date}}</td><td>₹{{'%.2f'|format(b.total_amount)}}</td><td>{{b.payment_status}}</td><td>{{b.payment_method}}</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
