{% extends 'base.html' %}{% block content %}<h2>Rooms</h2><div class="row g-3">{% for r in rooms %}<div class="col-md-4"><div class="card room-card"><div class="card-body"><h4>Room {{r.room_no}}</h4><p>{{r.room_type}}</p><h5>₹{{r.daily_charge}} / day</h5><span class="badge {% if r.status=='Available' %}bg-success{% elif r.status=='Occupied' %}bg-danger{% else %}bg-warning text-dark{% endif %}">{{r.status}}</span></div></div></div>{% endfor %}</div>{% endblock %}
