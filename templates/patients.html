{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between mb-3"><h2>Patients</h2><a class="btn btn-primary" href="{{url_for('add_patient')}}">+ Register Patient</a></div><div class="card"><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>Code</th><th>Name</th><th>Gender</th><th>Phone</th><th>Blood Group</th><th>Address</th></tr></thead><tbody>{% for p in patients %}<tr><td>{{p.patient_code}}</td><td>{{p.name}}</td><td>{{p.gender}}</td><td>{{p.phone or '-'}}</td><td>{{p.blood_group or '-'}}</td><td>{{p.address or '-'}}</td></tr>{% else %}<tr><td colspan="6" class="text-center">No patients found</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
