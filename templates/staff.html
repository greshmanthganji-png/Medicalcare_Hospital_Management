{% extends 'base.html' %}{% block content %}<h2>Staff Accounts</h2><div class="card p-3 mb-4"><form method="post" action="{{url_for('add_staff')}}"><div class="row g-2"><div class="col-md-4"><input name="username" class="form-control" placeholder="Username" required></div><div class="col-md-4"><input name="password" type="password" class="form-control" placeholder="Password" required></div><div class="col-md-3"><select name="role" class="form-select"><option>receptionist</option><option>doctor</option><option>nurse</option><option>admin</option></select></div><div class="col-md-1"><button class="btn btn-primary">Add</button></div></div></form></div><div class="card"><table class="table mb-0"><thead><tr><th>ID</th><th>Username</th><th>Role</th><th>Created</th></tr></thead><tbody>{% for s in staff %}<tr><td>{{s.id}}</td><td>{{s.username}}</td><td>{{s.role}}</td><td>{{s.created_at}}</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
