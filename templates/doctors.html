{% extends 'base.html' %}{% block content %}<h2>Doctors</h2><div class="row g-3">{% for d in doctors %}<div class="col-md-6 col-lg-4"><div class="card h-100"><div class="card-body"><h5>{{d.name}}</h5><p class="mb-1"><b>{{d.specialization}}</b></p><p class="text-muted">{{d.department_name or 'General'}}</p><p>📞 {{d.phone or '-'}}<br>✉️ {{d.email or '-'}}<br>Consultation: ₹{{d.consultation_fee}}</p></div></div></div>{% endfor %}</div>{% endblock %}
